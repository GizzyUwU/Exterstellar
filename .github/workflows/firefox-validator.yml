name: Firefox Check

on:
  push:
  pull_request:

jobs:
  firefox-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: cd extension && npm ci

      - name: Build
        run: cd extension && npm run build
      
      - name: Copy static files
        run: |
          cd extension
          cp manifest.json popup.html popup.css dist/
          cp -r images dist/

      - name: Install Add-ons linter
        run: npm install -g addons-linter

      - name: Run AMO Validator
        run: addons-linter ./extension/dist --output=text --enable-color